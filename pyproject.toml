[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pagedoc"
version = "0.1.0"
description = "Deterministic Markdown-first authoring and fixed-page rendering engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "markdown-it-py>=3.0,<5",
    "PyYAML>=6.0,<7",
    # Authoritative fixed-page layout backend. Pinned to the 66.x series:
    # the adapter reads private box-tree internals (Page._page_box) that
    # may change between minor versions; see backends/weasyprint.py.
    "weasyprint>=66.0,<67",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
]
# Optional raster/flatten pipeline + cross-renderer visual validation.
# Isolated from the core parser/lint/HTML path; loaded lazily.
raster = [
    "pypdfium2>=4.30,<6",
    "PyMuPDF>=1.24,<2",
    "img2pdf>=0.5,<1",
    "Pillow>=10,<12",
]

[project.scripts]
pagedoc = "pagedoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pagedoc = ["theme/builtin/*.yaml", "theme/builtin/*.css", "theme/builtin/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
